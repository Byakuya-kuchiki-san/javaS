<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rock Paper and Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src=".\images\rock.gif" alt="" id="Rock">
        </div>
         <div class="choice" id="paper">
            <img src=".\images\paper.gif" alt="" id="Paper">
        </div>
         <div class="choice" id="scissors">
            <img src=".\images\scissors.gif" alt="" id="Scissors">
        </div>
    </div>
    <div class="scores">
        <div class="score">
             <p id="userScore">0</p>
             <p id="user">UserScore</p>
        </div>
        <div class="score">
            <p id="compScore">0</p>
            <p id="comp">CompScore</p>
        </div>
    </div>
    <div class="result">
        <p id="result">Place your move</p>
        <button id="resetBtn">Reset</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
